<div class="flex h-screen">

  <!--Sidebar-->
  <app-side-nav [isNavExpanded]="isNavExpanded" [isMobile]="isMobile" (toggle)="toggleSidebar()"></app-side-nav>

  <!--Main-->
  <main class="flex-1 flex flex-col overflow-auto bg-gray-50">

    <!--Header-->
    <app-header [isNavExpanded]="isNavExpanded" (toggleNav)="toggleSidebar()"></app-header>

    <!--Router content/body -->
    <section class="p-4 w-fit">
      <router-outlet></router-outlet>
    </section>

    <!--Footer -->
    <app-footer class="mt-auto" />
  </main>
</div>
